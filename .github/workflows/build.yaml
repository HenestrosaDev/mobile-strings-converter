name: Build

on:
  # Runs on `main` too, so that Codecov has the coverage of the branch for its badge
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packages/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'action.yml'
      - '.github/workflows/build.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: |
          uv run coverage run -m unittest discover tests
          uv run coverage report
          uv run coverage xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: true

  # The package must work without the optional dependencies (`pdf` and `sheets`)
  test-without-extras:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Convert a file
        run: |
          uv run --isolated --no-project --with . mobile-strings-converter \
            tests/files/input/strings.xml -f "$RUNNER_TEMP/strings.xlsx"

      - name: Fail with a helpful message when an extra is missing
        run: |
          ! uv run --isolated --no-project --with . mobile-strings-converter \
            tests/files/input/strings.xml -f "$RUNNER_TEMP/strings.pdf" 2> errors.txt
          grep "mobile-strings-converter\[pdf\]" errors.txt

  # The GitHub Action of the repository must pass on a project without issues
  test-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Check translations
        uses: ./
        with:
          paths: tests/files/res
          check-untranslated: "true"
