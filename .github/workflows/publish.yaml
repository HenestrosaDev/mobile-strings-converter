name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI must list this repository, workflow and environment as
    # a trusted publisher (https://docs.pypi.org/trusted-publishers/)
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Build
        run: uv build

      - name: Publish
        run: uv publish
