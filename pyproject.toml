[project]
name = "mobile-strings-converter"
version = "0.2.0"
description = "Convert Android & iOS strings files to any supported file type and vice versa."
authors = [{ name = "José Carlos López", email = "henestrosadev@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Other OS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "android",
    "strings.xml",
    "strings",
    "converter",
    "csv",
    "xlsx",
    "yaml",
    "html",
    "json",
    "ods",
    "pdf",
    "md",
    "ios",
    "Localizable.strings"
]
dependencies = [
    "pyyaml (>=6.0.2,<7.0.0)",
    "gspread (>=6.2.1,<7.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "fpdf2 (>=2.8.9,<3.0.0)",
    "python-bidi (>=0.6.11,<0.7.0)",
    "arabic-reshaper (>=3.0.1,<4.0.0)",
    "ezodf (>=0.3.2,<0.4.0)",
    "lxml (>=6.1.3,<7.0.0)",
]

[project.urls]
repository = "https://github.com/HenestrosaDev/mobile-strings-converter"

[project.scripts]
mobile-strings-converter = "mobile_strings_converter.__main__:main"

[dependency-groups]
dev = ["pre-commit>=4.0.0,<5.0.0"]
test = ["coverage>=7.16.2,<8.0.0"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
