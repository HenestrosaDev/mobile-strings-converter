[project]
name = "mobile-strings-converter"
version = "0.2.0"
description = "Convert Android & iOS strings files to any supported file type and vice versa."
authors = [{ name = "José Carlos López", email = "henestrosadev@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Topic :: Text Processing :: General",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Other OS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
keywords = [
    "android",
    "strings.xml",
    "strings",
    "converter",
    "csv",
    "xlsx",
    "yaml",
    "html",
    "json",
    "ods",
    "pdf",
    "md",
    "ios",
    "Localizable.strings"
]
dependencies = [
    "pyyaml (>=6.0.2,<7.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "ezodf (>=0.3.2,<0.4.0)",
    "lxml (>=6.1.3,<7.0.0)",
]

[project.optional-dependencies]
pdf = [
    "fpdf2 (>=2.8.9,<3.0.0)",
    "python-bidi (>=0.6.11,<0.7.0)",
    "arabic-reshaper (>=3.0.1,<4.0.0)",
]
sheets = ["gspread (>=6.2.1,<7.0.0)"]
all = ["mobile-strings-converter[pdf,sheets]"]

[project.urls]
repository = "https://github.com/HenestrosaDev/mobile-strings-converter"
changelog = "https://github.com/HenestrosaDev/mobile-strings-converter/blob/main/CHANGELOG.md"

[project.scripts]
mobile-strings-converter = "mobile_strings_converter.__main__:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0,<5.0.0",
    "ruff>=0.14.0",
    "mypy>=1.18.0",
    "types-pyyaml",
    "types-openpyxl",
    "lxml-stubs",
]
test = ["mobile-strings-converter[all]", "coverage>=7.16.2,<8.0.0"]

[tool.uv]
default-groups = "all"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
mypy_path = "tests"
check_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["ezodf", "ezodf.*", "arabic_reshaper", "bidi.*"]
ignore_missing_imports = true
